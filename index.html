<script>
/* ===== Sports ReHub Load Log — cloud sync (Supabase) ===== */
(function () {
  var SB_URL = 'https://kyhegdwzsqucfpzjxdif.supabase.co';
  var SB_KEY = 'sb_publishable_3pUJ6LS6p9l4ycPSzOnClw_rjndX5s4';
  var PFX = 'trl_', META = 'll_meta', OUT = 'll_outbox', FLAG = 'll_loggedin';
  var sb = null, user = null, pollTimer = null, flushTimer = null, flushing = false, stale = false;
  function lsGet(k, f) { try { var v = localStorage.getItem(k); return v == null ? f : JSON.parse(v); } catch (e) { return f; } }
  function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  var meta = lsGet(META, {}), outbox = lsGet(OUT, []);
  function saveMeta() { lsSet(META, meta); }
  function saveOut() { lsSet(OUT, outbox); }
  function eq(a, b) { try { return JSON.stringify(a) === JSON.stringify(b); } catch (e) { return false; } }

  /* ---------- tiny UI ---------- */
  var css = document.createElement('style');
  css.textContent =
    '.ll-pill{position:fixed;left:10px;bottom:10px;z-index:9999;display:flex;gap:8px;align-items:center;background:rgba(24,17,11,.92);color:#E8DCC8;border:1px solid #4a3a28;border-radius:999px;padding:6px 12px;font:500 12px "IBM Plex Sans",system-ui,sans-serif}' +
    '.ll-pill button{background:none;border:none;color:#C79A56;font:inherit;cursor:pointer;text-decoration:underline;padding:0}' +
    '.ll-dot{width:8px;height:8px;border-radius:50%;background:#888}.ll-ok .ll-dot{background:#6FBF73}.ll-busy .ll-dot{background:#C79A56}.ll-off .ll-dot{background:#D9822B}.ll-err .ll-dot{background:#D95C4A}' +
    '.ll-banner{position:fixed;left:50%;transform:translateX(-50%);top:10px;z-index:9999;background:#C79A56;color:#18110B;border-radius:999px;padding:9px 18px;font:600 13px "IBM Plex Sans",system-ui,sans-serif;display:none;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.4)}' +
    '.ll-login{position:fixed;inset:0;z-index:10000;background:#18110B;display:flex;align-items:center;justify-content:center;padding:20px;font-family:"IBM Plex Sans",system-ui,sans-serif}' +
    '.ll-login form{width:100%;max-width:340px;background:#241a12;border:1px solid #4a3a28;border-radius:18px;padding:26px;color:#E8DCC8}' +
    '.ll-login h1{margin:0 0 4px;font:600 20px "Space Grotesk",system-ui,sans-serif}.ll-login p{margin:0 0 18px;color:#a8977e;font-size:13px}' +
    '.ll-login input{width:100%;margin:0 0 10px;padding:11px 14px;border-radius:999px;border:1px solid #4a3a28;background:#18110B;color:#fff;font:inherit;font-size:15px}' +
    '.ll-login button{width:100%;padding:12px;border:none;border-radius:999px;background:#C79A56;color:#18110B;font:600 15px inherit;cursor:pointer}' +
    '.ll-err-t{color:#F08C7C;font-size:13px;min-height:18px;margin-bottom:8px}' +
    '@media print{.ll-pill,.ll-banner,.ll-login{display:none!important}}';
  document.head.appendChild(css);
  var pill = document.createElement('div'); pill.className = 'll-pill ll-busy'; pill.style.display = 'none';
  pill.innerHTML = '<span class="ll-dot"></span><span class="ll-txt">…</span><button type="button" class="ll-out" style="display:none">Αποσύνδεση</button>';
  var banner = document.createElement('div'); banner.className = 'll-banner'; banner.textContent = 'Νεότερα δεδομένα από άλλη συσκευή — πάτησε για ανανέωση';
  banner.onclick = function () { location.reload(); };
  function mount() { document.body.appendChild(pill); document.body.appendChild(banner); }
  if (document.body) mount(); else document.addEventListener('DOMContentLoaded', mount);
  function setStatus(kind, text) {
    pill.style.display = 'flex'; pill.className = 'll-pill ll-' + kind;
    pill.querySelector('.ll-txt').textContent = text;
    pill.querySelector('.ll-out').style.display = user ? '' : 'none';
  }
  pill.querySelector('.ll-out').onclick = async function () {
    if (outbox.length && !confirm('Υπάρχουν αλλαγές που δεν έχουν συγχρονιστεί. Αποσύνδεση ούτως ή άλλως;')) return;
    try { await sb.auth.signOut(); } catch (e) {}
    try { localStorage.removeItem(FLAG); } catch (e) {}
    location.reload();
  };

  function showLogin() {
    return new Promise(function (resolve) {
      var w = document.createElement('div'); w.className = 'll-login';
      w.innerHTML = '<form><h1>Load Log</h1><p>Σύνδεση για συγχρονισμό μεταξύ συσκευών.</p>' +
        '<input type="email" id="ll-e" placeholder="Email" autocomplete="username" required>' +
        '<input type="password" id="ll-p" placeholder="Κωδικός" autocomplete="current-password" required>' +
        '<div class="ll-err-t" id="ll-t"></div><button type="submit">Σύνδεση</button></form>';
      (document.body ? Promise.resolve() : new Promise(function (r) { document.addEventListener('DOMContentLoaded', r); })).then(function () {
        document.body.appendChild(w);
        w.querySelector('form').onsubmit = async function (ev) {
          ev.preventDefault();
          var b = w.querySelector('button'); b.disabled = true; b.textContent = 'Σύνδεση…';
          var r = await sb.auth.signInWithPassword({ email: w.querySelector('#ll-e').value.trim(), password: w.querySelector('#ll-p').value });
          if (r.error || !r.data || !r.data.session) { w.querySelector('#ll-t').textContent = 'Λάθος email ή κωδικός.'; b.disabled = false; b.textContent = 'Σύνδεση'; return; }
          w.remove(); resolve(r.data.session);
        };
      });
    });
  }

  /* ---------- sync core ---------- */
  function localKeys() { var ks = []; for (var i = 0; i < localStorage.length; i++) { var k = localStorage.key(i); if (k && k.indexOf(PFX) === 0) ks.push(k); } return ks; }
  async function pushNow(key, val) {
    var r = await sb.from('loadlog_data').upsert({ user_id: user.id, key: key, value: val }, { onConflict: 'user_id,key' }).select('updated_at').single();
    if (r.error) throw r.error;
    meta[key] = r.data.updated_at; saveMeta();
  }
  async function delNow(key) {
    var r = await sb.from('loadlog_data').delete().eq('key', key);
    if (r.error) throw r.error;
    delete meta[key]; saveMeta();
  }
  async function flush() {
    if (!sb || !user || flushing || !outbox.length) return;
    flushing = true; setStatus('busy', 'Συγχρονισμός…');
    try {
      var keys = outbox.slice();
      for (var i = 0; i < keys.length; i++) {
        var k = keys[i], raw = localStorage.getItem(k);
        if (raw == null) await delNow(k); else await pushNow(k, JSON.parse(raw));
        outbox = outbox.filter(function (x) { return x !== k; }); saveOut();
      }
      setStatus('ok', 'Συγχρονισμένο');
    } catch (e) {
      console.error('sync', e);
      setStatus(navigator.onLine ? 'err' : 'off', navigator.onLine ? 'Σφάλμα συγχρονισμού' : 'Εκτός σύνδεσης — θα συγχρονιστεί');
    } finally { flushing = false; }
  }
  function queue(key) {
    if (key.indexOf(PFX) !== 0) return;
    if (outbox.indexOf(key) < 0) { outbox.push(key); saveOut(); }
    clearTimeout(flushTimer); flushTimer = setTimeout(flush, 700);
    if (user) setStatus('busy', 'Αποθήκευση…');
  }
  function mergeFirst(l, c, key) {
    try { localStorage.setItem('ll_backup_' + key, JSON.stringify(l)); } catch (e) {}
    var arr = Array.isArray(l) && Array.isArray(c);
    if (arr && l.concat(c).every(function (x) { return x && typeof x === 'object' && x.id != null; })) {
      var seen = {}, out = [];
      c.forEach(function (x) { seen[x.id] = 1; out.push(x); });
      l.forEach(function (x) { if (!seen[x.id]) out.push(x); });
      if (key.indexOf('trl_patients') !== 0 && out.every(function (x) { return /^\d+$/.test(String(x.id)); })) out.sort(function (a, b) { return Number(b.id) - Number(a.id); });
      return out;
    }
    if (!arr && l && c && typeof l === 'object' && typeof c === 'object' && !Array.isArray(l) && !Array.isArray(c)) return Object.assign({}, l, c);
    return c;
  }
  async function initialSync() {
    setStatus('busy', 'Συγχρονισμός…');
    var r = await sb.from('loadlog_data').select('key,value,updated_at');
    if (r.error) {
      var missing = /relation|does not exist|schema cache|loadlog_data/i.test(r.error.message || '');
      setStatus('err', missing ? 'Λείπει ο πίνακας στο Supabase' : 'Σφάλμα συγχρονισμού');
      if (missing) alert('Ο συγχρονισμός δεν είναι έτοιμος: τρέξε το loadlog-sync.sql στο Supabase (SQL Editor). Η εφαρμογή δουλεύει προς το παρόν μόνο τοπικά.');
      user = null; return;
    }
    var cloud = {}; (r.data || []).forEach(function (row) { cloud[row.key] = row; });
    var keys = {}; Object.keys(cloud).forEach(function (k) { keys[k] = 1; }); localKeys().forEach(function (k) { keys[k] = 1; });
    var ks = Object.keys(keys);
    for (var i = 0; i < ks.length; i++) {
      var key = ks[i], c = cloud[key], has = localStorage.getItem(key) != null, l = has ? lsGet(key, null) : null;
      if (!c) { if (has) { try { await pushNow(key, l); } catch (e) { if (outbox.indexOf(key) < 0) outbox.push(key); } } continue; }
      if (!has) { if (outbox.indexOf(key) >= 0) { /* deleted locally while offline */ continue; } lsSet(key, c.value); meta[key] = c.updated_at; continue; }
      if (eq(l, c.value)) { meta[key] = c.updated_at; continue; }
      if (outbox.indexOf(key) >= 0) continue;                 /* local newer, will be pushed by flush */
      if (meta[key]) { if (c.updated_at > meta[key]) { lsSet(key, c.value); meta[key] = c.updated_at; } else { await pushNow(key, l); } continue; }
      var m = mergeFirst(l, c.value, key); lsSet(key, m); await pushNow(key, m);
    }
    saveMeta(); saveOut();
    await flush();
  }
  async function poll() {
    if (!sb || !user || document.hidden) return;
    try {
      var r = await sb.from('loadlog_data').select('key,updated_at');
      if (r.error) return;
      var cloud = {}; (r.data || []).forEach(function (x) { cloud[x.key] = x.updated_at; });
      var changed = false;
      Object.keys(cloud).forEach(function (k) { if (outbox.indexOf(k) < 0 && (!meta[k] || cloud[k] > meta[k])) changed = true; });
      Object.keys(meta).forEach(function (k) { if (!(k in cloud) && outbox.indexOf(k) < 0) changed = true; });
      if (changed) {
        var full = await sb.from('loadlog_data').select('key,value,updated_at');
        if (!full.error) {
          (full.data || []).forEach(function (row) { if (outbox.indexOf(row.key) < 0 && (!meta[row.key] || row.updated_at > meta[row.key])) { if (!eq(lsGet(row.key, null), row.value)) { lsSet(row.key, row.value); stale = true; } meta[row.key] = row.updated_at; } });
          Object.keys(meta).forEach(function (k) { if (!(k in cloud) && outbox.indexOf(k) < 0) { try { localStorage.removeItem(k); } catch (e) {} delete meta[k]; stale = true; } });
          saveMeta();
          if (stale) banner.style.display = 'block';
        }
      }
      if (!outbox.length) setStatus('ok', 'Συγχρονισμένο');
    } catch (e) { setStatus('off', 'Εκτός σύνδεσης — θα συγχρονιστεί'); }
  }
  function background() {
    window.addEventListener('online', function () { flush(); poll(); });
    window.addEventListener('offline', function () { setStatus('off', 'Εκτός σύνδεσης — θα συγχρονιστεί'); });
    document.addEventListener('visibilitychange', function () { if (!document.hidden) { flush(); poll(); } });
    pollTimer = setInterval(function () { flush(); poll(); }, 30000);
    window.addEventListener('beforeunload', function () { if (outbox.length) flush(); });
  }

  window.llSync = {
    push: function (key) { queue(key); },
    del: function (key) { queue(key); },
    ready: (async function () {
      try {
        if (!window.supabase) { setStatus('off', 'Μόνο τοπικά (χωρίς σύνδεση)'); return; }
        sb = window.supabase.createClient(SB_URL, SB_KEY);
        var session = null;
        try { var g = await sb.auth.getSession(); session = g && g.data && g.data.session; } catch (e) {}
        if (!session) {
          if (!navigator.onLine && localStorage.getItem(FLAG)) { setStatus('off', 'Εκτός σύνδεσης — θα συγχρονιστεί'); return; }
          session = await showLogin();
        }
        user = session.user; try { localStorage.setItem(FLAG, '1'); } catch (e) {}
        await initialSync();
        if (user) background();
      } catch (e) { console.error(e); setStatus('off', 'Μόνο τοπικά'); }
    })()
  };
})();
</script>

function Grain({ type, active }) {
  const stroke = active ? T.bg : T.paperDim;
  const common = { stroke, strokeWidth: 1.1, fill: "none", opacity: active ? 0.55 : 0.35 };
  return (
    <svg width="30" height="18" viewBox="0 0 34 18" aria-hidden="true">
      {type === "fiber" && [0, 6, 12, 18].map((y) => <path key={y} d={`M0 ${y + 2} C 8 ${y - 2}, 26 ${y + 6}, 34 ${y + 2}`} {...common} />)}
      {type === "stripe" && [3, 7, 11, 15].map((y) => <line key={y} x1="0" y1={y} x2="34" y2={y} {...common} />)}
      {type === "lattice" && (
        <g {...common}>
          <line x1="0" y1="0" x2="34" y2="18" /><line x1="0" y1="18" x2="34" y2="0" />
          <line x1="17" y1="0" x2="17" y2="18" /><line x1="0" y1="9" x2="34" y2="9" />
        </g>
      )}
      {type === "cross" && (
        <g {...common}>
          {[2, 12, 22, 32].map((x) => <line key={"a" + x} x1={x} y1="0" x2={x - 10} y2="18" />)}
          {[2, 12, 22, 32].map((x) => <line key={"b" + x} x1={x - 10} y1="0" x2={x} y2="18" />)}
        </g>
      )}
      {type === "pulse" && <path d="M0 9 L8 9 L11 2 L15 16 L18 9 L34 9" {...common} />}
    </svg>
  );
}

function borgLabel(v) {
  if (v === 0) return "καμία";
  if (v <= 2) return "πολύ ελαφριά";
  if (v <= 4) return "ελαφριά";
  if (v <= 6) return "μέτρια";
  if (v <= 8) return "έντονη";
  return "μέγιστη";
}

function ScaleInput({ label, value, onChange, low, high, danger, plain }) {
  return (
    <div style={{ marginBottom: 14 }}>
      <div style={{ display: "flex", justifyContent: "space-between", fontFamily: "'IBM Plex Mono', monospace", fontSize: 12, color: T.paperDim, marginBottom: 6 }}>
        <span>{label}</span>
        <span style={{ color: danger && value >= 6 ? T.rust : T.gold }}>{value}{plain ? " / 10" : ` · ${borgLabel(value)}`}</span>
      </div>
      <input type="range" min={0} max={10} value={value} onChange={(e) => onChange(Number(e.target.value))}
        style={{ width: "100%", accentColor: danger && value >= 6 ? T.rust : T.terracotta }} />
      <div style={{ display: "flex", justifyContent: "space-between", fontSize: 10, color: T.paperDim, opacity: 0.6, marginTop: 2 }}>
        <span>{low}</span><span>{high}</span>
      </div>
    </div>
  );
}

}

function TrendChart({ data, series, domain, xKey }) {
  const w = 600, h = 200, padL = 38, padR = 12, padT = 10, padB = 24;
  const innerW = w - padL - padR, innerH = h - padT - padB;
  const n = data.length;
  const [dMin, dMax] = domain;
  const x = (i) => padL + (n === 1 ? innerW / 2 : (innerW * i) / (n - 1));
  const y = (v) => padT + innerH - (innerH * (v - dMin)) / (dMax - dMin || 1);
  const ticks = 5;
  const tickVals = Array.from({ length: ticks }, (_, i) => dMin + ((dMax - dMin) * i) / (ticks - 1));
  const path = (key) => data.map((d, i) => `${i === 0 ? "M" : "L"} ${x(i)} ${y(d[key])}`).join(" ");
  return (
    <div>
      <svg viewBox={`0 0 ${w} ${h}`} style={{ width: "100%", height: 200, display: "block" }}>
        {tickVals.map((v) => <line key={v} x1={padL} x2={w - padR} y1={y(v)} y2={y(v)} stroke={T.panelLine} strokeDasharray="3 3" />)}
        {tickVals.map((v) => <text key={v} x={padL - 6} y={y(v) + 3} fontSize="9" fill={T.paperDim} textAnchor="end">{Math.round(v)}</text>)}
        {data.map((d, i) => <text key={i} x={x(i)} y={h - 6} fontSize="9" fill={T.paperDim} textAnchor="middle">{(d[xKey] || "").slice(5)}</text>)}
        {series.map((s) => (
          <g key={s.key}>
            <path d={path(s.key)} fill="none" stroke={s.color} strokeWidth="2" />
            {data.map((d, i) => <circle key={i} cx={x(i)} cy={y(d[s.key])} r="3" fill={s.color} />)}
          </g>
        ))}
      </svg>
      <div style={{ display: "flex", gap: 14, flexWrap: "wrap", paddingLeft: 8, marginTop: 4 }}>
        {series.map((s) => (
          <div key={s.key} style={{ display: "flex", alignItems: "center", gap: 5, fontSize: 11, color: T.paperDim }}>
            <span style={{ width: 9, height: 9, borderRadius: 2, background: s.color, display: "inline-block" }} />{s.label}
          </div>
        ))}
      </div>
    </div>
  );
}
function autoDomain(values) {
  const nums = values.filter((v) => typeof v === "number" && !isNaN(v));
  if (!nums.length) return [0, 10];
  const max = Math.max(...nums);
  const niceMax = Math.ceil((max * 1.2) / 5) * 5 || 10;
  return [0, niceMax];
}

const store = {
  get(key, fallback) { try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; } catch { return fallback; } },
  set(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); if (window.llSync) window.llSync.push(key); return true; } catch { return false; } },
  remove(key) { try { localStorage.removeItem(key); if (window.llSync) window.llSync.del(key); } catch {} },
};

function daysBetween(a, b) { return Math.floor((b - a) / 86400000); }
function weekNumber(startDate, entryDate) {
  if (!startDate) return null;
  const s = new Date(startDate + "T00:00:00");
  const e = new Date(entryDate + "T00:00:00");
  const d = daysBetween(s, e);
  if (d < 0) return null;
  return Math.floor(d / 7) + 1;
}

    const next = { ...customTypes, [tissueId]: [...existing, name] };
    setCustomTypes(next);
    store.set("trl_customtypes", next);
    setForm({ ...form, loadType: name });
    setNewTypeName(""); setAddingType(false);
    flashToast("Προστέθηκε νέος τύπος φόρτισης");
  };

  const addExercise = () => {
    const name = exDraft.name.trim();
    if (!name) return;
    if (exercises.some((ex) => ex.name.toLowerCase() === name.toLowerCase())) { flashToast("Υπάρχει ήδη στη βάση"); return; }
    const ex = { id: `${Date.now()}`, name, category: exDraft.category, defaultLoadType: exDraft.defaultLoadType, notes: exDraft.notes.trim() };
    const next = [...exercises, ex];
    setExercises(next);
    store.set("trl_exercises", next);
    setExDraft({ name: "", category: EXERCISE_CATEGORIES[0], defaultLoadType: "", notes: "" });
    flashToast("Προστέθηκε στη βάση ασκήσεων");
  };
  const removeExercise = (id) => {
    const next = exercises.filter((e) => e.id !== id);
    setExercises(next);
    store.set("trl_exercises", next);
  };
  const pickExercise = (name) => {
    setForm((f) => {
      const match = exercises.find((e) => e.name === name);
      return { ...f, activity: name, loadType: match && match.defaultLoadType ? match.defaultLoadType : f.loadType };
    });
  };

  const saveEntry = useCallback(() => {
    if (!activePatient) return;
    if (!form.activity.trim()) { flashToast("Πρόσθεσε όνομα άσκησης/δραστηριότητας"); return; }
    setSaving(true);
    const entry = {
      id: `${Date.now()}`, date: sessionDate, tissue: tissueId,
      cardioMode: isCardio ? cardioMode : undefined,
      recordedBy: mode === "clinician" ? "Θεραπευτής" : "Ασθενής", v2: true,
      week: patient ? weekNumber(patient.startDate, sessionDate) : null,
      ...form,
    };
    const next = [entry, ...entries];
    setEntries(next);
    const ok = store.set(`trl_entries_${activePatient}`, next);
    flashToast(ok ? "Καταχωρήθηκε" : "Η αποθήκευση απέτυχε");
    setSaving(false);
    setForm({ ...emptyForm, loadType: allLoadTypes[0] });
  }, [activePatient, entries, form, tissueId, mode, tissue, customTypes, cardioMode, patient, sessionDate]);

  const deleteEntry = (id) => {
    const next = entries.filter((e) => e.id !== id);
    setEntries(next);
    store.set(`trl_entries_${activePatient}`, next);
  };

  const saveMeasurement = (category) => {
    if (!activePatient) return;
    setSaving(true);
    const base = category === "jump" ? jumpForm : isoForm;
    const extra = (base.extra || []).filter((x) => x.name.trim() && String(x.value).trim() !== "");
    let computed = {};
    if (category === "isometric") {
      const r = parseFloat(isoForm.rightForce), l = parseFloat(isoForm.leftForce);
      if (!isNaN(r) && !isNaN(l) && Math.max(r, l) > 0) {
        computed.asymmetryCalc = Math.round((Math.abs(r - l) / Math.max(r, l)) * 1000) / 10;
      }
    }
    const entry = {
      id: `${Date.now()}`, date: sessionDate, category,
      week: patient ? weekNumber(patient.startDate, sessionDate) : null,
      ...base, extra, ...computed,
    };
    const next = [entry, ...measurements];
    setMeasurements(next);
    const ok = store.set(`trl_measurements_${activePatient}`, next);
    flashToast(ok ? "Καταχωρήθηκε μέτρηση" : "Η αποθήκευση απέτυχε");
    setSaving(false);
    if (category === "jump") setJumpForm(emptyJumpForm); else setIsoForm(emptyIsoForm);
  };
  const deleteMeasurement = (id) => {
    const next = measurements.filter((m) => m.id !== id);
    setMeasurements(next);
    store.set(`trl_measurements_${activePatient}`, next);
  };

  const ad = (k, v) => setAssessDraft((d) => ({ ...d, [k]: v }));
  const sd = (k, v) => setSessionDraft((d) => ({ ...d, [k]: v }));
  const saveAssessment = () => {
    if (!activePatient) return;
    const next = { ...assessments, [sessionDate]: { ...assessDraft, date: sessionDate, week: selWeek, updatedAt: Date.now() } };
    setAssessments(next);
    flashToast(store.set(`trl_assess_${activePatient}`, next) ? "Αποθηκεύτηκε η εκτίμηση" : "Η αποθήκευση απέτυχε");
  };
  const deleteAssessment = () => {
    if (!assessments[sessionDate] || !window.confirm("Διαγραφή της εκτίμησης αυτής της ημέρας;")) return;
    const next = { ...assessments }; delete next[sessionDate];
    setAssessments(next); store.set(`trl_assess_${activePatient}`, next);
  };
  const saveSessionRec = () => {
    if (!activePatient) return;
    const next = { ...sessions, [sessionDate]: { ...sessionDraft, date: sessionDate, week: selWeek, updatedAt: Date.now() } };
    setSessions(next);
    flashToast(store.set(`trl_sessions_${activePatient}`, next) ? "Αποθηκεύτηκε η συνεδρία" : "Η αποθήκευση απέτυχε");
  };
  const deleteSessionRec = () => {
    if (!sessions[sessionDate] || !window.confirm("Διαγραφή της συνεδρίας αυτής της ημέρας;")) return;
    const next = { ...sessions }; delete next[sessionDate];
    setSessions(next); store.set(`trl_sessions_${activePatient}`, next);
  };
  const dayEntries = entries.filter((e) => e.date === sessionDate);
  const dayMeas = measurements.filter((m) => m.date === sessionDate);

  // Load management: session load = duration (min) x session RPE (sRPE, AU)
  const sessLoads = Object.entries(sessions).map(([d, x]) => ({ date: d, load: (Number(x.duration) || 0) * (x.sessionRPE || 0), rpe: x.sessionRPE })).filter((x) => x.load > 0);
  const loadOn = (from, to) => sessLoads.filter((x) => x.date >= from && x.date <= to).reduce((a, x) => a + x.load, 0);
  const acute = loadOn(shiftYmd(sessionDate, -6), sessionDate);
  const chronic = loadOn(shiftYmd(sessionDate, -27), sessionDate) / 4;
  const acwr = chronic > 0 ? acute / chronic : null;
  const acwrZone = acwr == null ? null : acwr < 0.8 ? ["Χαμηλό φορτίο", T.paperDim] : acwr <= 1.3 ? ["Βέλτιστη ζώνη", T.sage] : acwr <= 1.5 ? ["Προσοχή", T.gold] : ["Υψηλή αύξηση φορτίου", T.rust];
  const weekRows = Array.from({ length: 8 }, (_, i) => {
    const ws = shiftYmd(weekStartYmd(sessionDate), -7 * (7 - i)); const we = shiftYmd(ws, 6);
    const inW = (d) => d >= ws && d <= we;
    const visitDates = new Set([...entries.map((e) => e.date), ...measurements.map((m) => m.date), ...Object.keys(assessments), ...Object.keys(sessions)].filter(inW));
    const sl = sessLoads.filter((x) => inW(x.date));
    const pains = Object.entries(assessments).filter(([d]) => inW(d)).map(([, a]) => Number(a.severityNow) || 0);
    return { ws, we, visits: visitDates.size, load: sl.reduce((a, x) => a + x.load, 0), rpe: sl.length ? sl.reduce((a, x) => a + x.rpe, 0) / sl.length : null, pain: pains.length ? pains.reduce((a, x) => a + x, 0) / pains.length : null };
  });
  const painChart = Object.entries(assessments).sort((a, b) => a[0].localeCompare(b[0])).map(([d, a]) => ({ date: d, now: Number(a.severityNow) || 0, best: Number(a.severityBest) || 0, worst: Number(a.severityWorst) || 0 }));
  const shortD = (ymd) => `${ymd.slice(8, 10)}/${ymd.slice(5, 7)}`;

  const patientName = patient?.name;
  const onDay = (x) => !dayOnly || x.date === sessionDate;
  const tissueAll = entries.filter((e) => e.tissue === tissueId).slice().reverse();
  const tissueEntries = tissueAll.filter(onDay);
  const chartData = tissueAll.map((e) => ({ date: e.date, sessionRPE: rpeOf(e), painDuring: e.painDuring, pain24h: e.pain24h }));
  const hrData = tissueAll.filter((e) => e.heartRateAvg !== "" && e.heartRateAvg != null).map((e) => ({ date: e.date, heartRateAvg: Number(e.heartRateAvg) }));
  const isPatientMode = mode === "patient";

  const jumpAll = measurements.filter((m) => m.category === "jump").slice().reverse();
  const isoAll = measurements.filter((m) => m.category === "isometric").slice().reverse();
  const jumpEntries = jumpAll.filter(onDay);
  const isoEntries = isoAll.filter(onDay);
  const datesWithRecords = (() => {
    const map = {};
    entries.forEach((e) => { map[e.date] = (map[e.date] || 0) + 1; });
    measurements.forEach((m) => { map[m.date] = (map[m.date] || 0) + 1; });
    Object.keys(assessments).forEach((d) => { map[d] = (map[d] || 0) + 1; });
    Object.keys(sessions).forEach((d) => { map[d] = (map[d] || 0) + 1; });
    return Object.entries(map).sort((a, b) => b[0].localeCompare(a[0]));
  })();
  const jumpChartData = jumpAll.filter((j) => j.jumpHeight !== "").map((j) => ({ date: j.date, jumpHeight: Number(j.jumpHeight) }));
  const isoChartData = isoAll.map((i) => {
    const r = parseFloat(i.rightForce), l = parseFloat(i.leftForce), tot = parseFloat(i.totalForce);
    const val = !isNaN(tot) ? tot : (!isNaN(r) && !isNaN(l) ? (r + l) / 2 : (!isNaN(r) ? r : (!isNaN(l) ? l : null)));
    return val != null ? { date: i.date, force: val } : null;
  }).filter(Boolean);

  const patientHasPersonal = patient && (patient.age || patient.phone || patient.email || patient.occupation || patient.sport || patient.dominantLimb);
  const patientHasMedical = patient && (patient.pathology || patient.affectedSide || patient.injuryDate || patient.medicalHistory || patient.medications || patient.comorbidities || patient.referringDoctor || patient.imaging || patient.allergies);

  const assessmentView = (
    <>
      <Panel title="Ιατρική Εκτίμηση — κύριο παράπονο & ιστορικό" accent>
        <div style={{ display: "grid", gap: 12 }}>
          <TextAreaField label="Κύριο παράπονο" value={assessDraft.chiefComplaint} onChange={(v) => ad("chiefComplaint", v)} rows={2} placeholder="Με δικά του λόγια του ασθενή" />
          <TextAreaField label="Μηχανισμός τραυματισμού / ιστορικό παρούσας νόσου" value={assessDraft.mechanism} onChange={(v) => ad("mechanism", v)} rows={3} />
          <TextAreaField label="Στόχοι / προσδοκίες ασθενή" value={assessDraft.goals} onChange={(v) => ad("goals", v)} rows={2} />
        </div>
      </Panel>

      <Panel title="SOCRATES — εκτίμηση πόνου">
        <SocLetter letter="S" title="Site — Θέση">
          <div style={{ display: "grid", gridTemplateColumns: "1.6fr 1fr", gap: 8 }}>
            <input value={assessDraft.site} onChange={(e) => ad("site", e.target.value)} placeholder="π.χ. οπίσθια επιφάνεια μηρού, έσω γόνατο" style={inputStyle} />
            <SelectField label="" value={assessDraft.siteSide} onChange={(v) => ad("siteSide", v)} options={SOC_SIDE} />
          </div>
        </SocLetter>
        <SocLetter letter="O" title="Onset — Έναρξη">
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8 }}>
            <SelectField label="" value={assessDraft.onset} onChange={(v) => ad("onset", v)} options={SOC_ONSET} />
            <input value={assessDraft.onsetNote} onChange={(e) => ad("onsetNote", e.target.value)} placeholder="πότε / πώς ξεκίνησε" style={inputStyle} />
          </div>
        </SocLetter>
        <SocLetter letter="C" title="Character — Χαρακτήρας">
          <ChipGroup options={SOC_CHARACTER} value={assessDraft.character} onChange={(v) => ad("character", v)} />
          <input value={assessDraft.characterNote} onChange={(e) => ad("characterNote", e.target.value)} placeholder="σχόλιο (προαιρετικό)" style={{ ...inputStyle, marginTop: 8 }} />
        </SocLetter>
        <SocLetter letter="R" title="Radiation — Αντανάκλαση">
          <input value={assessDraft.radiation} onChange={(e) => ad("radiation", e.target.value)} placeholder="πού επεκτείνεται ο πόνος" style={inputStyle} />
        </SocLetter>
        <SocLetter letter="A" title="Associations — Συνοδά συμπτώματα">
          <input value={assessDraft.associations} onChange={(e) => ad("associations", e.target.value)} placeholder="οίδημα, αστάθεια, κλείδωμα, μούδιασμα, αδυναμία…" style={inputStyle} />
        </SocLetter>
        <SocLetter letter="T" title="Time course — Πορεία στον χρόνο">
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8 }}>
            <SelectField label="" value={assessDraft.timeCourse} onChange={(v) => ad("timeCourse", v)} options={SOC_TIME} />
            <input value={assessDraft.timeNote} onChange={(e) => ad("timeNote", e.target.value)} placeholder="διάρκεια / μοτίβο 24ώρου" style={inputStyle} />
          </div>
        </SocLetter>
        <SocLetter letter="E" title="Exacerbating / Relieving — Επιδεινωτικοί / ανακουφιστικοί παράγοντες">
          <div style={{ display: "grid", gap: 8 }}>
            <TextAreaField label="Επιδεινωτικοί" value={assessDraft.exacerbating} onChange={(v) => ad("exacerbating", v)} rows={2} />
            <TextAreaField label="Ανακουφιστικοί" value={assessDraft.relieving} onChange={(v) => ad("relieving", v)} rows={2} />
          </div>
        </SocLetter>
        <SocLetter letter="S" title="Severity — Ένταση (0–10)">
          <ScaleInput label="Τώρα" value={assessDraft.severityNow} onChange={(v) => ad("severityNow", v)} low="καθόλου" high="αφόρητος" danger plain />
          <ScaleInput label="Καλύτερη (τελευταίες 24 ώρες)" value={assessDraft.severityBest} onChange={(v) => ad("severityBest", v)} low="καθόλου" high="αφόρητος" danger plain />
          <ScaleInput label="Χειρότερη (τελευταίες 24 ώρες)" value={assessDraft.severityWorst} onChange={(v) => ad("severityWorst", v)} low="καθόλου" high="αφόρητος" danger plain />
        </SocLetter>
      </Panel>

      <Panel title="Red flags">
        <ChipGroup options={RED_FLAGS} value={assessDraft.redFlags} onChange={(v) => ad("redFlags", v)} />
        <input value={assessDraft.redFlagNote} onChange={(e) => ad("redFlagNote", e.target.value)} placeholder="σχόλιο (προαιρετικό)" style={{ ...inputStyle, marginTop: 8 }} />
      </Panel>

      <Panel title="Κλινική εκτίμηση & πλάνο">
        <div style={{ display: "grid", gap: 12 }}>
          <TextAreaField label="Κλινική εντύπωση / διαφορική διάγνωση" value={assessDraft.impression} onChange={(v) => ad("impression", v)} rows={3} />
          <TextAreaField label="Πλάνο / παρέμβαση" value={assessDraft.plan} onChange={(v) => ad("plan", v)} rows={3} />
        </div>
      </Panel>

      <div style={{ display: "flex", flexWrap: "wrap", gap: 8, marginBottom: 22 }}>
        <button onClick={saveAssessment} style={{ flex: "1 1 200px", background: T.terracotta, color: T.bg, border: "none", borderRadius: 9, padding: "12px", fontSize: 14.5, fontWeight: 700, cursor: "pointer", fontFamily: "'Space Grotesk', sans-serif" }}>
          {assessments[sessionDate] ? "Ενημέρωση εκτίμησης" : "Αποθήκευση εκτίμησης"} · {fmtDay(sessionDate)}
        </button>
        <button onClick={() => setPrintMode("filled")} style={{ flex: "1 1 120px", background: T.panel, color: T.gold, border: `1px solid ${T.gold}`, borderRadius: 9, padding: "12px", fontSize: 13.5, fontWeight: 600, cursor: "pointer" }}>Εκτύπωση</button>
        <button onClick={() => setPrintMode("blank")} style={{ flex: "1 1 120px", background: T.panel, color: T.paper, border: `1px solid ${T.panelLine}`, borderRadius: 9, padding: "12px", fontSize: 13.5, cursor: "pointer" }}>Κενή φόρμα</button>
        {assessments[sessionDate] && <button onClick={deleteAssessment} style={{ background: "none", color: T.rust, border: `1px solid ${T.panelLine}`, borderRadius: 9, padding: "12px 14px", fontSize: 13, cursor: "pointer" }}>Διαγραφή</button>}
      </div>
      <div style={{ fontSize: 12, color: T.paperDim, marginTop: -10, marginBottom: 22 }}>{assessments[sessionDate] ? "Υπάρχει αποθηκευμένη εκτίμηση για αυτή την ημέρα." : "Νέα εκτίμηση — δεν έχει αποθηκευτεί ακόμα για αυτή την ημέρα."}</div>

      {painChart.length > 1 && (
        <div style={{ background: T.panel, border: `1px solid ${T.panelLine}`, borderRadius: 14, padding: "18px 10px 8px", marginBottom: 22 }}>
          <div style={{ fontFamily: "'Space Grotesk', sans-serif", fontWeight: 600, fontSize: 14, marginBottom: 10, paddingLeft: 8 }}>Τάση έντασης πόνου (SOCRATES)</div>
          <TrendChart data={painChart} xKey="date" domain={[0, 10]} series={[
            { key: "now", color: T.terracotta, label: "Τώρα" }, { key: "best", color: T.sage, label: "Καλύτερη" }, { key: "worst", color: T.rust, label: "Χειρότερη" },
          ]} />
        </div>
      )}
    </>
  );

  const dayAvgRpe = dayEntries.length ? (dayEntries.reduce((a, e) => a + Number(rpeOf(e) || 0), 0) / dayEntries.length) : null;
  const dailyView = (
    <>
      <Panel title={`Ημερήσια Συνεδρία — ${fmtDay(sessionDate)}`} accent>
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginBottom: 14 }}>
          <NumberField label="Διάρκεια συνεδρίας" unit="λεπτά" value={sessionDraft.duration} onChange={(v) => sd("duration", v)} placeholder="60" />
          <Field label="Φορτίο συνεδρίας (AU)">
            <div style={{ ...inputStyle, color: T.gold, fontFamily: "'IBM Plex Mono', monospace" }}>{sessionDraft.duration ? Number(sessionDraft.duration) * sessionDraft.sessionRPE : "—"}</div>
          </Field>
        </div>
        <ScaleInput label="Συνολικό RPE συνεδρίας (Borg CR10)" value={sessionDraft.sessionRPE} onChange={(v) => sd("sessionRPE", v)} low="χαλαρά" high="εξάντληση" />
        <div style={{ fontSize: 11, textTransform: "uppercase", letterSpacing: "0.08em", color: T.paperDim, margin: "6px 0 10px" }}>Γενική ψυχική εικόνα ασθενή</div>
        <ScaleInput label="Διάθεση" value={sessionDraft.mood} onChange={(v) => sd("mood", v)} low="πολύ χαμηλή" high="πολύ καλή" plain />
        <ScaleInput label="Ενέργεια" value={sessionDraft.energy} onChange={(v) => sd("energy", v)} low="εξάντληση" high="γεμάτος ενέργεια" plain />
        <ScaleInput label="Ποιότητα ύπνου" value={sessionDraft.sleep} onChange={(v) => sd("sleep", v)} low="πολύ κακή" high="εξαιρετική" plain />
        <ScaleInput label="Στρες / άγχος" value={sessionDraft.stress} onChange={(v) => sd("stress", v)} low="καθόλου" high="πολύ υψηλό" danger plain />
        <ScaleInput label="Κίνητρο / προθυμία" value={sessionDraft.motivation} onChange={(v) => sd("motivation", v)} low="χαμηλό" high="υψηλό" plain />
        <div style={{ display: "grid", gap: 12, marginTop: 6 }}>
          <TextAreaField label="Συμπεράσματα ημέρας (φόρτιση, ανταπόκριση, προσαρμογές)" value={sessionDraft.conclusions} onChange={(v) => sd("conclusions", v)} rows={3} />
          <TextAreaField label="Σημειώσεις" value={sessionDraft.notes} onChange={(v) => sd("notes", v)} rows={2} />
        </div>
        <div style={{ display: "flex", gap: 8, marginTop: 16 }}>
          <button onClick={saveSessionRec} style={{ flex: 1, background: T.terracotta, color: T.bg, border: "none", borderRadius: 9, padding: "12px", fontSize: 14.5, fontWeight: 700, cursor: "pointer", fontFamily: "'Space Grotesk', sans-serif" }}>{sessions[sessionDate] ? "Ενημέρωση συνεδρίας" : "Αποθήκευση συνεδρίας"}</button>
          {sessions[sessionDate] && <button onClick={deleteSessionRec} style={{ background: "none", color: T.rust, border: `1px solid ${T.panelLine}`, borderRadius: 9, padding: "12px 14px", fontSize: 13, cursor: "pointer" }}>Διαγραφή</button>}
        </div>
      </Panel>
      <Panel title={`Ασκήσεις της ημέρας (${dayEntries.length})`}>
        {dayEntries.length === 0 ? <div style={{ color: T.paperDim, fontSize: 13, opacity: 0.8 }}>Καμία καταγραφή φορτίου για αυτή την ημέρα.</div> : (
          <>
            {dayAvgRpe != null && <div style={{ fontSize: 12.5, color: T.gold, marginBottom: 8 }}>Μέσο RPE ασκήσεων: {dayAvgRpe.toFixed(1)}</div>}
            {dayEntries.map((e) => (
              <div key={e.id} style={{ fontSize: 13, padding: "6px 0", borderBottom: `1px solid ${T.panelLine}` }}>
                <b>{e.activity}</b> <span style={{ color: T.paperDim }}>· {TISSUES.find((t) => t.id === e.tissue)?.label} · RPE {rpeOf(e)}{(e.sets || e.reps) ? ` · ${e.sets || "–"}×${e.reps || "–"}` : ""}{e.tempo ? ` · ${e.tempo}` : ""}</span>
              </div>
            ))}
          </>
        )}
      </Panel>
    </>
  );

  const loadMgmtView = (
    <>
      <Panel title={`Διαχείριση Φορτίου — έως ${fmtDay(sessionDate)}`} accent>
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 10, marginBottom: 12 }}>
          <div><div style={{ fontSize: 11, color: T.paperDim }}>Οξύ (7 ημ.)</div><div style={{ fontSize: 22, fontWeight: 700, color: T.paper }}>{Math.round(acute)}<span style={{ fontSize: 11, color: T.paperDim }}> AU</span></div></div>
          <div><div style={{ fontSize: 11, color: T.paperDim }}>Χρόνιο (μ.ό. 4 εβδ.)</div><div style={{ fontSize: 22, fontWeight: 700, color: T.paper }}>{Math.round(chronic)}<span style={{ fontSize: 11, color: T.paperDim }}> AU</span></div></div>
          <div><div style={{ fontSize: 11, color: T.paperDim }}>ACWR</div><div style={{ fontSize: 22, fontWeight: 700, color: acwrZone ? acwrZone[1] : T.paperDim }}>{acwr != null ? acwr.toFixed(2) : "—"}</div></div>

                              {extraText(m) && <React.Fragment>{extraText(m)}</React.Fragment>}
                            </div>
                            {m.notes && <div style={{ marginTop: 6, color: T.paper, opacity: 0.85 }}>{m.notes}</div>}
                          </div>
                        ))}
                      </div>
                    )}
                  </>
                )}

                {measureTab === "isometric" && (
                  <>
                    <div style={{ background: T.panel, border: `1px solid ${T.panelLine}`, borderRadius: 14, padding: 18, marginBottom: 22 }}>
                      <div style={{ fontFamily: "'Space Grotesk', sans-serif", fontWeight: 600, fontSize: 15, marginBottom: 14 }}>Νέα ισομετρική μέτρηση — {patientName}</div>
                      <div style={{ marginBottom: 14 }}>
                        <SelectField label="Τύπος τεστ" value={isoForm.testType} onChange={(v) => setIsoForm({ ...isoForm, testType: v })} options={ISO_TYPES} />
                      </div>
                      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginBottom: 14 }}>
                        <NumberField label="Δεξιά" unit="N" value={isoForm.rightForce} onChange={(v) => setIsoForm({ ...isoForm, rightForce: v })} placeholder="420" />
                        <NumberField label="Αριστερή" unit="N" value={isoForm.leftForce} onChange={(v) => setIsoForm({ ...isoForm, leftForce: v })} placeholder="395" />
                      </div>
                      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginBottom: 14 }}>
                        <NumberField label="Συνολική Peak Force" unit="N" value={isoForm.totalForce} onChange={(v) => setIsoForm({ ...isoForm, totalForce: v })} placeholder="π.χ. iMTP: 1850" />
                        <NumberField label="RFD" unit="N/s" value={isoForm.rfd} onChange={(v) => setIsoForm({ ...isoForm, rfd: v })} placeholder="προαιρετικό" />
                      </div>
                      <p style={{ fontSize: 11, color: T.paperDim, marginTop: -6, marginBottom: 14 }}>Για iMTP συνήθως μόνο "Συνολική Peak Force". Για ForceFrame (διμερή τεστ) συμπλήρωσε Δεξιά/Αριστερή — η ασυμμετρία υπολογίζεται αυτόματα.</p>
                      <ExtraMetrics items={isoForm.extra || []} onChange={(v) => setIsoForm({ ...isoForm, extra: v })} />
                      <label style={{ display: "block", fontSize: 12, color: T.paperDim, marginBottom: 6 }}>Σημειώσεις</label>
                      <textarea value={isoForm.notes} onChange={(e) => setIsoForm({ ...isoForm, notes: e.target.value })} rows={2} style={{ ...inputStyle, marginBottom: 16, resize: "vertical" }} />
                      <button onClick={() => saveMeasurement("isometric")} disabled={saving} style={{
                        width: "100%", background: T.terracotta, color: T.bg, border: "none", borderRadius: 9,
                        padding: "12px", fontSize: 14.5, fontWeight: 700, cursor: saving ? "default" : "pointer",
                        opacity: saving ? 0.7 : 1, fontFamily: "'Space Grotesk', sans-serif",
                      }}>{saving ? "Αποθήκευση…" : "Καταχώρηση μέτρησης"}</button>
                    </div>

                    {isoChartData.length > 1 && (
                      <div style={{ background: T.panel, border: `1px solid ${T.panelLine}`, borderRadius: 14, padding: "18px 10px 8px", marginBottom: 22 }}>
                        <div style={{ fontFamily: "'Space Grotesk', sans-serif", fontWeight: 600, fontSize: 14, marginBottom: 10, paddingLeft: 8 }}>Τάση δύναμης (Peak Force)</div>
                        <TrendChart data={isoChartData} xKey="date" domain={autoDomain(isoChartData.map((d) => d.force))} series={[{ key: "force", color: T.rust, label: "Peak Force (N)" }]} />
                      </div>
                    )}

                    <div style={{ fontSize: 11, textTransform: "uppercase", letterSpacing: "0.08em", color: T.paperDim, marginBottom: 10 }}>Ιστορικό ισομετρικά ({isoEntries.length})</div>
                    {isoEntries.length === 0 ? (
                      <div style={{ color: T.paperDim, fontSize: 13, opacity: 0.7 }}>Καμία μέτρηση ακόμη.</div>
                    ) : (
                      <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                        {isoEntries.map((m) => (
                          <div key={m.id} style={{ background: T.bgSoft, border: `1px solid ${T.panelLine}`, borderRadius: 10, padding: "12px 14px", fontSize: 13 }}>
                            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 4 }}>
                              <span style={{ fontWeight: 600 }}>{m.testType}</span>
                              <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                                <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, color: T.paperDim }}>{m.date}{m.week ? ` · Εβδ.${m.week}` : ""}</span>
                                <button onClick={() => deleteMeasurement(m.id)} style={{ background: "none", border: "none", color: T.paperDim, cursor: "pointer", padding: 2 }}><Icon name="trash" size={13} /></button>
                              </div>
                            </div>
                            <div style={{ color: T.paperDim, fontSize: 12 }}>
                              {m.totalForce && <React.Fragment><strong style={{ color: T.gold }}>{m.totalForce} N</strong> · </React.Fragment>}
                              {(m.rightForce || m.leftForce) && <React.Fragment>Δ {m.rightForce || "–"}N / Α {m.leftForce || "–"}N · </React.Fragment>}
                              {m.asymmetryCalc != null && <React.Fragment>ασυμμετρία {m.asymmetryCalc}% · </React.Fragment>}
                              {m.rfd && <React.Fragment>RFD {m.rfd} N/s · </React.Fragment>}
                              {extraText(m) && <React.Fragment>{extraText(m)}</React.Fragment>}
                            </div>
                            {m.notes && <div style={{ marginTop: 6, color: T.paper, opacity: 0.85 }}>{m.notes}</div>}
                          </div>
                        ))}
                      </div>
                    )}
                  </>
                )}
              </>
            )}
          </>
        )}
        <div style={{ marginTop: 40, paddingTop: 16, borderTop: `1px solid ${T.panelLine}`, fontSize: 11.5, color: T.paperDim, lineHeight: 1.6, textAlign: "center" }}>
          <b style={{ color: T.paper }}>{CLINIC.doctor}</b> · {CLINIC.name}<br />{CLINIC.address} · Τηλ. {CLINIC.phone} · {CLINIC.web}
        </div>
      </div>

      {toast && (
        <div style={{ position: "fixed", bottom: 20, left: "50%", transform: "translateX(-50%)", background: T.gold, color: T.bg, padding: "10px 20px", borderRadius: 999, fontSize: 13, fontWeight: 600, boxShadow: "0 8px 24px rgba(0,0,0,0.4)" }}>{toast}</div>
      )}
    </div>
    {printMode && (
      <PrintDoc blank={printMode === "blank"} patient={patient} date={sessionDate} week={selWeek} visitNo={visitNo}
        a={printMode === "blank" ? emptyAssess() : assessDraft} sess={sessions[sessionDate]} dayEntries={dayEntries} dayMeas={dayMeas} />
    )}
    </>
  );
}

(window.llSync ? window.llSync.ready : Promise.resolve()).catch(() => {}).then(() => ReactDOM.createRoot(document.getElementById("root")).render(<TissueLoadLog />));
</script>

<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("service-worker.js").catch(() => {});
    });
  }
</script>
</body>
</html>
