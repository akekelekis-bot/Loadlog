<script type="text/babel" data-presets="react">

function Icon(props) {
  const { name, ...rest } = props;
  const paths = {
    plus: <path d="M12 5v14M5 12h14"/>,
    trash: <path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0-1 14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2L4 6"/>,
    chevron: <path d="M6 9l6 6 6-6"/>,
    user: <React.Fragment><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></React.Fragment>,
    stethoscope: <React.Fragment><path d="M4 3v6a5 5 0 0 0 10 0V3M9 15a5 5 0 0 0 10 0v-2"/><circle cx="19" cy="10" r="2"/></React.Fragment>,
    activity: <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>,
    x: <path d="M18 6 6 18M6 6l12 12"/>,
    heart: <path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/>,
    pencil: <path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/>,
    book: <React.Fragment><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></React.Fragment>,
    folder: <path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/>,
    gauge: <React.Fragment><path d="M12 20a8 8 0 1 0-8-8"/><path d="M12 12l4-4M4 12H2M12 2v2M22 12h-2"/></React.Fragment>,
  };
  const strokeW = name === "plus" || name === "x" ? 2.5 : 2;
  return <svg width={rest.size || 14} height={rest.size || 14} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={strokeW} strokeLinecap="round" strokeLinejoin="round" style={rest.style}>{paths[name]}</svg>;
}

function Grain({ type, active }) {
  const stroke = active ? T.bg : T.paperDim;
  const common = { stroke, strokeWidth: 1.1, fill: "none", opacity: active ? 0.55 : 0.35 };
  return (
    <svg width="30" height="18" viewBox="0 0 34 18" aria-hidden="true">
      {type === "fiber" && [0, 6, 12, 18].map((y) => <path key={y} d={`M0 ${y + 2} C 8 ${y - 2}, 26 ${y + 6}, 34 ${y + 2}`} {...common} />)}
      {type === "stripe" && [3, 7, 11, 15].map((y) => <line key={y} x1="0" y1={y} x2="34" y2={y} {...common} />)}
      {type === "lattice" && (
        <g {...common}>
          <line x1="0" y1="0" x2="34" y2="18" /><line x1="0" y1="18" x2="34" y2="0" />
          <line x1="17" y1="0" x2="17" y2="18" /><line x1="0" y1="9" x2="34" y2="9" />
        </g>
      )}
      {type === "cross" && (
        <g {...common}>
          {[2, 12, 22, 32].map((x) => <line key={"a" + x} x1={x} y1="0" x2={x - 10} y2="18" />)}
          {[2, 12, 22, 32].map((x) => <line key={"b" + x} x1={x - 10} y1="0" x2={x} y2="18" />)}
        </g>
      )}
      {type === "pulse" && <path d="M0 9 L8 9 L11 2 L15 16 L18 9 L34 9" {...common} />}
    </svg>
  );
}

function borgLabel(v) {
  if (v === 0) return "καμία";
  if (v <= 2) return "πολύ ελαφριά";
  if (v <= 4) return "ελαφριά";
  if (v <= 6) return "μέτρια";
  if (v <= 8) return "έντονη";
  return "μέγιστη";
}

function ScaleInput({ label, value, onChange, low, high, danger }) {
  return (
    <div style={{ marginBottom: 14 }}>
      <div style={{ display: "flex", justifyContent: "space-between", fontFamily: "'IBM Plex Mono', monospace", fontSize: 12, color: T.paperDim, marginBottom: 6 }}>
        <span>{label}</span>
        <span style={{ color: danger && value >= 6 ? T.rust : T.gold }}>{value} · {borgLabel(value)}</span>
      </div>
      <input type="range" min={0} max={10} value={value} onChange={(e) => onChange(Number(e.target.value))}
        style={{ width: "100%", accentColor: danger && value >= 6 ? T.rust : T.terracotta }} />
      <div style={{ display: "flex", justifyContent: "space-between", fontSize: 10, color: T.paperDim, opacity: 0.6, marginTop: 2 }}>
        <span>{low}</span><span>{high}</span>
      </div>
    </div>
  );
}

function Field({ label, unit, children }) {
  return (
    <div>
      <label style={{ display: "block", fontSize: 11, color: T.paperDim, marginBottom: 6 }}>{label}{unit ? ` (${unit})` : ""}</label>
      {children}
    </div>
  );
}
const inputStyle = { width: "100%", background: T.bgSoft, border: `1px solid ${T.panelLine}`, borderRadius: 8, padding: "9px 10px", color: T.paper, fontSize: 13 };

function NumberField({ label, value, onChange, placeholder, unit }) {
  return (
    <Field label={label} unit={unit}>
      <input type="number" inputMode="decimal" value={value} onChange={(e) => onChange(e.target.value)} placeholder={placeholder} style={inputStyle} />
    </Field>
  );
}
function TextField({ label, value, onChange, placeholder }) {
  return (
    <Field label={label}>
      <input value={value} onChange={(e) => onChange(e.target.value)} placeholder={placeholder} style={inputStyle} />
    </Field>
  );
}
function SelectField({ label, value, onChange, options }) {
  return (
    <Field label={label}>
      <div style={{ position: "relative" }}>
        <select value={value} onChange={(e) => onChange(e.target.value)} style={{ ...inputStyle, padding: "9px 30px 9px 10px", appearance: "none" }}>
          {options.map((o) => <option key={o} value={o}>{o}</option>)}
        </select>
        <Icon name="chevron" size={14} style={{ position: "absolute", right: 9, top: 10, color: T.paperDim, pointerEvents: "none" }} />
      </div>
    </Field>
  );
}

function TrendChart({ data, series, domain, xKey }) {
  const w = 600, h = 200, padL = 38, padR = 12, padT = 10, padB = 24;
  const innerW = w - padL - padR, innerH = h - padT - padB;
  const n = data.length;
  const [dMin, dMax] = domain;
  const x = (i) => padL + (n === 1 ? innerW / 2 : (innerW * i) / (n - 1));
  const y = (v) => padT + innerH - (innerH * (v - dMin)) / (dMax - dMin || 1);
  const ticks = 5;
  const tickVals = Array.from({ length: ticks }, (_, i) => dMin + ((dMax - dMin) * i) / (ticks - 1));
  const path = (key) => data.map((d, i) => `${i === 0 ? "M" : "L"} ${x(i)} ${y(d[key])}`).join(" ");
  return (
    <div>
      <svg viewBox={`0 0 ${w} ${h}`} style={{ width: "100%", height: 200, display: "block" }}>
        {tickVals.map((v) => <line key={v} x1={padL} x2={w - padR} y1={y(v)} y2={y(v)} stroke={T.panelLine} strokeDasharray="3 3" />)}
        {tickVals.map((v) => <text key={v} x={padL - 6} y={y(v) + 3} fontSize="9" fill={T.paperDim} textAnchor="end">{Math.round(v)}</text>)}
        {data.map((d, i) => <text key={i} x={x(i)} y={h - 6} fontSize="9" fill={T.paperDim} textAnchor="middle">{(d[xKey] || "").slice(5)}</text>)}
        {series.map((s) => (
          <g key={s.key}>
            <path d={path(s.key)} fill="none" stroke={s.color} strokeWidth="2" />
            {data.map((d, i) => <circle key={i} cx={x(i)} cy={y(d[s.key])} r="3" fill={s.color} />)}
          </g>
        ))}
      </svg>
      <div style={{ display: "flex", gap: 14, flexWrap: "wrap", paddingLeft: 8, marginTop: 4 }}>
        {series.map((s) => (
          <div key={s.key} style={{ display: "flex", alignItems: "center", gap: 5, fontSize: 11, color: T.paperDim }}>
            <span style={{ width: 9, height: 9, borderRadius: 2, background: s.color, display: "inline-block" }} />{s.label}
          </div>
        ))}
      </div>
    </div>
  );
}
function autoDomain(values) {
  const nums = values.filter((v) => typeof v === "number" && !isNaN(v));
  if (!nums.length) return [0, 10];
  const max = Math.max(...nums);
  const niceMax = Math.ceil((max * 1.2) / 5) * 5 || 10;
  return [0, niceMax];
}

const store = {
  get(key, fallback) { try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; } catch { return fallback; } },
  set(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); return true; } catch { return false; } },
  remove(key) { try { localStorage.removeItem(key); } catch {} },
};

function daysBetween(a, b) { return Math.floor((b - a) / 86400000); }
function weekNumber(startDate, entryDate) {
  if (!startDate) return null;
  const s = new Date(startDate + "T00:00:00");
  const e = new Date(entryDate + "T00:00:00");
  const d = daysBetween(s, e);
  if (d < 0) return null;
  return Math.floor(d / 7) + 1;
}

const emptyPatientDraft = () => ({
  name: "", startDate: new Date().toISOString().slice(0, 10),
  age: "", phone: "", email: "", occupation: "", sport: "", dominantLimb: SIDE_OPTIONS[0],
  pathology: "", affectedSide: SIDE_OPTIONS[0], injuryDate: "", medicalHistory: "",
  medications: "", comorbidities: "", referringDoctor: "", imaging: "", allergies: "",
});

const localYmd = (d = new Date()) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const shiftYmd = (ymd, n) => { const [y,m,d] = ymd.split("-").map(Number); return localYmd(new Date(y, m-1, d+n)); };
const fmtDay = (ymd) => { const [y,m,d] = ymd.split("-").map(Number); const dt = new Date(y, m-1, d); return `${["Κυρ","Δευ","Τρί","Τετ","Πέμ","Παρ","Σάβ"][dt.getDay()]} ${String(d).padStart(2,"0")}/${String(m).padStart(2,"0")}/${y}`; };

function TissueLoadLog() {
  const [patients, setPatients] = useState(() => store.get("trl_patients", []));
  const [activePatient, setActivePatient] = useState(() => {
    const list = store.get("trl_patients", []);
    return list.length ? list[0].id : null;
  });
  const [entries, setEntries] = useState([]);
  const [measurements, setMeasurements] = useState([]);
  const [view, setView] = useState("load"); // load | measurements
  const [sessionDate, setSessionDate] = useState(() => localYmd());
  const [dayOnly, setDayOnly] = useState(false);
  const [tissueId, setTissueId] = useState("tendon");
  const [measureTab, setMeasureTab] = useState("jump"); // jump | isometric
  const [mode, setMode] = useState("clinician");
  const [showNewPatient, setShowNewPatient] = useState(false);
  const [editingPatient, setEditingPatient] = useState(false);
  const [patientDraft, setPatientDraft] = useState(emptyPatientDraft());
  const [saving, setSaving] = useState(false);
  const [toast, setToast] = useState(null);
  const [customTypes, setCustomTypes] = useState(() => store.get("trl_customtypes", {}));
  const [addingType, setAddingType] = useState(false);
  const [newTypeName, setNewTypeName] = useState("");
  const [cardioMode, setCardioMode] = useState("other");
  const [exercises, setExercises] = useState(() => {
    const saved = store.get("trl_exercises", null);
    if (saved) return saved;
    store.set("trl_exercises", SEED_EXERCISES);
    return SEED_EXERCISES;
  });
  const [showLibrary, setShowLibrary] = useState(false);
  const [exDraft, setExDraft] = useState({ name: "", category: EXERCISE_CATEGORIES[0], defaultLoadType: "", notes: "" });

  const tissue = TISSUES.find((t) => t.id === tissueId);
  const isCardio = !!tissue.cardio;
  const allLoadTypes = [...tissue.loadTypes, ...(customTypes[tissueId] || [])];

  const emptyForm = {
    activity: "", loadType: allLoadTypes[0], intensity: 5,
    resistance: "", resistanceUnit: "kg",
    sets: "", reps: "", tempo: "",
    duration: "", heartRateAvg: "", heartRatePercent: "",
    speed: "", pace: "", incline: "", resistanceLevel: "",
    frequency: "", session: "",
    painDuring: 0, pain24h: 0, sessionRPE: 3, notes: "",
  };
  const [form, setForm] = useState(emptyForm);

  const emptyJumpForm = { testType: JUMP_TYPES[0], jumpHeight: "", contactTime: "", flightTime: "", rsi: "", asymmetry: "", notes: "" };
  const emptyIsoForm = { testType: ISO_TYPES[0], rightForce: "", leftForce: "", totalForce: "", rfd: "", notes: "" };
  const [jumpForm, setJumpForm] = useState(emptyJumpForm);
  const [isoForm, setIsoForm] = useState(emptyIsoForm);

  useEffect(() => { setForm((f) => ({ ...f, loadType: allLoadTypes[0] })); setAddingType(false); }, [tissueId]);

  useEffect(() => {
    if (!activePatient) { setEntries([]); setMeasurements([]); return; }
    setEntries(store.get(`trl_entries_${activePatient}`, []));
    setMeasurements(store.get(`trl_measurements_${activePatient}`, []));
  }, [activePatient]);

  const flashToast = (msg) => { setToast(msg); setTimeout(() => setToast(null), 2200); };
  const patient = patients.find((p) => p.id === activePatient);

  const nextSession = useMemo(() => {
    const nums = entries.map((e) => Number(e.session)).filter((n) => !isNaN(n) && n > 0);
    return nums.length ? Math.max(...nums) + 1 : 1;
  }, [entries]);

  useEffect(() => { setForm((f) => ({ ...f, session: nextSession })); }, [nextSession, activePatient]);

  const todayWeek = patient ? weekNumber(patient.startDate, new Date().toISOString().slice(0, 10)) : null;

  const openNewPatient = () => {
    setPatientDraft({ ...emptyPatientDraft() });
    setShowNewPatient(true);
  };
  const saveNewPatient = () => {
    const name = patientDraft.name.trim();
    if (!name) return;
    const id = `${Date.now()}`;
    const next = [...patients, { id, ...patientDraft, name }];
    setPatients(next);
    setActivePatient(id);
    setShowNewPatient(false);
    store.set("trl_patients", next);
  };
  const openEditPatient = () => {
    if (!patient) return;
    setPatientDraft({ ...emptyPatientDraft(), ...patient });
    setEditingPatient(true);
  };
  const saveEditPatient = () => {
    const next = patients.map((p) => p.id === activePatient ? { ...p, ...patientDraft, name: patientDraft.name.trim() || p.name } : p);
    setPatients(next);
    store.set("trl_patients", next);
    setEditingPatient(false);
    flashToast("Ενημερώθηκε ο φάκελος ασθενή");
  };
  const removePatient = (id) => {
    const next = patients.filter((p) => p.id !== id);
    setPatients(next);
    if (activePatient === id) setActivePatient(next[0]?.id ?? null);
    store.set("trl_patients", next);
    store.remove(`trl_entries_${id}`);
    store.remove(`trl_measurements_${id}`);
  };

  const addCustomType = () => {
    const name = newTypeName.trim();
    if (!name) return;
    const existing = customTypes[tissueId] || [];
    if ([...tissue.loadTypes, ...existing].includes(name)) { setForm({ ...form, loadType: name }); setNewTypeName(""); setAddingType(false); return; }
    const next = { ...customTypes, [tissueId]: [...existing, name] };
    setCustomTypes(next);
    store.set("trl_customtypes", next);
    setForm({ ...form, loadType: name });
    setNewTypeName(""); setAddingType(false);
    flashToast("Προστέθηκε νέος τύπος φόρτισης");
  };

  const addExercise = () => {
    const name = exDraft.name.trim();
    if (!name) return;
    if (exercises.some((ex) => ex.name.toLowerCase() === name.toLowerCase())) { flashToast("Υπάρχει ήδη στη βάση"); return; }
    const ex = { id: `${Date.now()}`, name, category: exDraft.category, defaultLoadType: exDraft.defaultLoadType, notes: exDraft.notes.trim() };
    const next = [...exercises, ex];
    setExercises(next);
    store.set("trl_exercises", next);

                        <NumberField label="RFD" unit="N/s" value={isoForm.rfd} onChange={(v) => setIsoForm({ ...isoForm, rfd: v })} placeholder="προαιρετικό" />
                      </div>
                      <p style={{ fontSize: 11, color: T.paperDim, marginTop: -6, marginBottom: 14 }}>Για iMTP συνήθως μόνο "Συνολική Peak Force". Για ForceFrame (διμερή τεστ) συμπλήρωσε Δεξιά/Αριστερή — η ασυμμετρία υπολογίζεται αυτόματα.</p>
                      <label style={{ display: "block", fontSize: 12, color: T.paperDim, marginBottom: 6 }}>Σημειώσεις</label>
                      <textarea value={isoForm.notes} onChange={(e) => setIsoForm({ ...isoForm, notes: e.target.value })} rows={2} style={{ ...inputStyle, marginBottom: 16, resize: "vertical" }} />
                      <button onClick={() => saveMeasurement("isometric")} disabled={saving} style={{
                        width: "100%", background: T.terracotta, color: T.bg, border: "none", borderRadius: 9,
                        padding: "12px", fontSize: 14.5, fontWeight: 700, cursor: saving ? "default" : "pointer",
                        opacity: saving ? 0.7 : 1, fontFamily: "'Space Grotesk', sans-serif",
                      }}>{saving ? "Αποθήκευση…" : "Καταχώρηση μέτρησης"}</button>
                    </div>

                    {isoChartData.length > 1 && (
                      <div style={{ background: T.panel, border: `1px solid ${T.panelLine}`, borderRadius: 14, padding: "18px 10px 8px", marginBottom: 22 }}>
                        <div style={{ fontFamily: "'Space Grotesk', sans-serif", fontWeight: 600, fontSize: 14, marginBottom: 10, paddingLeft: 8 }}>Τάση δύναμης (Peak Force)</div>
                        <TrendChart data={isoChartData} xKey="date" domain={autoDomain(isoChartData.map((d) => d.force))} series={[{ key: "force", color: T.rust, label: "Peak Force (N)" }]} />
                      </div>
                    )}

                    <div style={{ fontSize: 11, textTransform: "uppercase", letterSpacing: "0.08em", color: T.paperDim, marginBottom: 10 }}>Ιστορικό ισομετρικά ({isoEntries.length})</div>
                    {isoEntries.length === 0 ? (
                      <div style={{ color: T.paperDim, fontSize: 13, opacity: 0.7 }}>Καμία μέτρηση ακόμη.</div>
                    ) : (
                      <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                        {isoEntries.map((m) => (
                          <div key={m.id} style={{ background: T.bgSoft, border: `1px solid ${T.panelLine}`, borderRadius: 10, padding: "12px 14px", fontSize: 13 }}>
                            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 4 }}>
                              <span style={{ fontWeight: 600 }}>{m.testType}</span>
                              <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                                <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, color: T.paperDim }}>{m.date}{m.week ? ` · Εβδ.${m.week}` : ""}</span>
                                <button onClick={() => deleteMeasurement(m.id)} style={{ background: "none", border: "none", color: T.paperDim, cursor: "pointer", padding: 2 }}><Icon name="trash" size={13} /></button>
                              </div>
                            </div>
                            <div style={{ color: T.paperDim, fontSize: 12 }}>
                              {m.totalForce && <React.Fragment><strong style={{ color: T.gold }}>{m.totalForce} N</strong> · </React.Fragment>}
                              {(m.rightForce || m.leftForce) && <React.Fragment>Δ {m.rightForce || "–"}N / Α {m.leftForce || "–"}N · </React.Fragment>}
                              {m.asymmetryCalc != null && <React.Fragment>ασυμμετρία {m.asymmetryCalc}% · </React.Fragment>}
                              {m.rfd && <React.Fragment>RFD {m.rfd} N/s</React.Fragment>}
                            </div>
                            {m.notes && <div style={{ marginTop: 6, color: T.paper, opacity: 0.85 }}>{m.notes}</div>}
                          </div>
                        ))}
                      </div>
                    )}
                  </>
                )}
              </>
            )}
          </>
        )}
      </div>

      {toast && (
        <div style={{ position: "fixed", bottom: 20, left: "50%", transform: "translateX(-50%)", background: T.gold, color: T.bg, padding: "10px 20px", borderRadius: 999, fontSize: 13, fontWeight: 600, boxShadow: "0 8px 24px rgba(0,0,0,0.4)" }}>{toast}</div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<TissueLoadLog />);
</script>

<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("service-worker.js").catch(() => {});
    });
  }
</script>
</body>
</html>
